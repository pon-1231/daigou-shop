<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯入訂單 · NAN｜推し研究所</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .order-card { margin-bottom: 14px; }
  .order-card .oc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .order-card .oc-head-left { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .order-card .oc-head input[type="checkbox"] { width: auto; cursor: pointer; }
  .order-card .oc-name-input { width: auto; min-width: 140px; font-weight: 700; font-size: 14px; padding: 4px 8px; }
  .order-card .oc-meta { font-family: var(--font-mono); color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .order-card.imported { opacity: 0.55; }
  .order-card.import-error { border-color: var(--bad); }

  .oi-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: var(--radius-sm); margin-top: 8px; font-size: 13px; }
  .oi-row.ok { background: var(--bg); }
  .oi-row.flag { background: var(--bad-soft); border: 1px solid var(--bad); }
  .oi-row.flag.resolved { background: var(--good-soft); border: 1px solid var(--good); }
  .oi-row .oi-raw { flex: 1 1 100%; font-size: 12px; color: var(--bad); }
  .oi-row.resolved .oi-raw { color: var(--good); }
  .oi-row select { width: auto; font-size: 12.5px; padding: 6px 8px; }
  .oi-row .oi-nums { font-family: var(--font-mono); color: var(--ink-soft); white-space: nowrap; margin-left: auto; }
  .oi-manual-fields { display: flex; gap: 6px; flex-wrap: wrap; }
  .oi-manual-fields input { width: auto; font-size: 12.5px; padding: 6px 8px; }
  .oi-manual-fields input.oi-manual-name { min-width: 180px; }
  .oi-manual-fields input.oi-manual-cost, .oi-manual-fields input.oi-manual-price { width: 90px; }
  .oi-edit-btn, .oi-remove-btn, .oc-add-item, .oi-pick-btn, .oi-gift-btn {
    font-family: var(--font-body); font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--bg-elevated); color: var(--ink-soft); cursor: pointer;
    flex-shrink: 0; white-space: nowrap;
  }
  .oi-remove-btn { color: var(--bad); border-color: var(--bad); }
  .oc-add-item { margin-top: 10px; border-style: dashed; }
  .oi-gift-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  /* 每樣商品都用跟 records.html 訂單卡片一樣的「縮圖+名稱+規格+數量+成本→售價」
     完整顯示，不是比對成功/新增就收合成只看得到名稱的一行——同名不同色的幾筆
     商品放在一起時，看得到圖跟完整規格才不會搞混是哪一筆。 */
  .oi-card { display: flex; align-items: center; gap: 8px; width: 100%; }
  .oi-card img, .oi-card .oi-placeholder {
    width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
    background: var(--bg-elevated); border: 1px solid var(--line);
  }
  .oi-card .oi-placeholder { display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink-soft); }
  .oi-card .oi-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .oi-card .oi-name { font-size: 12.5px; }
  .oi-card .oi-size { font-size: 10.5px; color: var(--ink-soft); }
  .oi-card .oi-gift-tag {
    font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
    border-radius: 4px; padding: 1px 5px; margin-left: 2px;
  }
  .oi-card .oi-nums { font-family: var(--font-mono); color: var(--ink-soft); font-size: 11px; }
  .oi-row input.oi-qty-input { width: 48px; font-size: 12.5px; padding: 6px 4px; text-align: center; flex-shrink: 0; }

  .oc-repeat { font-size: 11.5px; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .oc-note {
    width: 100%; margin-top: 10px; font-size: 12.5px; min-height: 44px; font-family: var(--font-body);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 7px 10px; resize: vertical;
  }

  /* 選圖面板開著時，訂單卡片分兩欄：左邊挑商品、右邊是這張訂單本身的內容
     (含新增進去的商品)，兩邊同時看得到，不用一直滑上滑下比對。訂單量多、
     卡片本來就很長的時候尤其有感。螢幕太窄(手機)放不下兩欄，改疊成一欄，
     這時候用 order 把訂單內容排到選圖面板前面——「+新增商品」按鈕就在
     訂單內容裡，手機上疊起來時讓使用者先看到自己點的那顆按鈕附近的東西，
     而不是一打開先看到整塊選圖面板，比較符合直覺。 */
  .oc-split { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(260px, 1.2fr); gap: 16px; align-items: start; }
  .oc-split .oc-picker-col, .oc-split .oc-main-col { min-width: 0; }
  @media (max-width: 760px) {
    .oc-split { grid-template-columns: 1fr; }
    .oc-split .oc-picker-col { order: 2; }
    .oc-split .oc-main-col { order: 1; }
  }

  /* ---------- 新增商品：圖片選圖面板（跟 records.html 同一套，簡化掉編輯價格/新增尺寸那些跟匯入無關的功能） ---------- */
  .picker-panel { margin-top: 14px; padding: 14px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--bg); }
  .oc-picker-col .picker-panel { margin-top: 0; }
  .picker-panel .picker-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .picker-panel .picker-head button { font-size: 12px; }
  .product-gallery { max-height: 360px; overflow-y: auto; padding: 2px; display: flex; flex-direction: column; gap: 10px; }
  .gallery-group summary { cursor: pointer; font-weight: 700; font-size: 12px; color: var(--ink-soft); padding: 4px 0; outline: none; }
  .gallery-group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 6px; }
  .gallery-card { border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; text-align: center; padding: 6px; position: relative; font-family: var(--font-body); }
  @media (hover: hover) { .gallery-card:hover { border-color: var(--accent); } }
  .gallery-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--bg-elevated); }
  .gallery-card .gc-placeholder { width: 100%; aspect-ratio: 1; border-radius: 6px; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--ink-soft); }
  .gallery-card .gc-name { font-size: 11px; margin-top: 5px; line-height: 1.3; }
  .gallery-card .gc-price { font-size: 10.5px; color: var(--ink-soft); font-family: var(--font-mono); }
  .gallery-card .gc-itemno { position: absolute; top: 4px; left: 4px; background: var(--bg-elevated); color: var(--ink-soft); font-size: 9.5px; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 3px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); border: 1px solid var(--line-strong); }
  .gallery-card .gc-stock { position: absolute; top: 4px; right: 4px; font-size: 9.5px; font-weight: 700; border-radius: 999px; height: 16px; padding: 0 5px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); background: var(--good-soft); color: var(--good); border: 1px solid var(--good); }
  .gallery-card .gc-stock.low { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
  .gallery-card .gc-stock.out { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .sp-stock { font-size: 11.5px; font-weight: 700; margin-left: 6px; }
  .sp-stock.ok { color: var(--good); }
  .sp-stock.low { color: var(--warn); }
  .sp-stock.out { color: var(--bad); }
  .size-picker { margin-top: 14px; padding: 12px; border-radius: var(--radius-sm); background: var(--accent-soft); }
  .size-picker .sp-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .size-picker .sp-quick { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .sp-option-row { display: flex; gap: 4px; }
  .sp-option-select { flex: 1; font-family: var(--font-body); font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--bg-elevated); color: var(--accent); cursor: pointer; text-align: left; }
  .sp-color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .sp-color-chip { font-family: var(--font-body); font-size: 12.5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg-elevated); color: var(--ink-soft); cursor: pointer; }
  .sp-color-chip.active { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .sp-size-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .sp-size-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font-family: var(--font-body); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--accent); background: var(--bg-elevated); color: var(--accent); cursor: pointer; }
  .sp-size-cell:disabled { border-color: var(--line-strong); background: var(--bg); color: var(--ink-soft); cursor: default; opacity: 0.7; }
  .sp-size-label { font-size: 12px; font-weight: 600; }
  .sp-size-price { font-size: 11px; font-family: var(--font-mono); }
  .size-picker .sp-cancel { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .picker-manual-add { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .picker-manual-add .pm-title { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; color: var(--ink-soft); }
  .picker-manual-add .pm-row { display: grid; grid-template-columns: 1.6fr 0.8fr 0.8fr auto; gap: 6px; }
  .picker-manual-add .pm-row input { font-size: 12.5px; padding: 7px 8px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); width: 100%; }
  @media (max-width: 480px) { .picker-manual-add .pm-row { grid-template-columns: 1fr 1fr; } }

  .dup-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--ink-soft); border-bottom: 1px dashed var(--line); }
  .dup-row:last-child { border-bottom: none; }

  .merge-warning {
    background: var(--bad-soft); border: 1px solid var(--bad); border-radius: var(--radius-sm);
    padding: 10px 12px; margin-top: 10px; font-size: 12.5px; color: var(--bad);
  }
  .merge-warning.acked { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .merge-warning label { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-weight: 600; cursor: pointer; }
  .merge-warning input { width: auto; cursor: pointer; }

  .select-all-label {
    display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500;
    color: var(--ink-soft); cursor: pointer;
  }
  .select-all-label input { width: auto; cursor: pointer; }

  .commit-bar { position: sticky; bottom: 16px; display: flex; align-items: center; gap: 12px; margin-top: 20px; padding: 14px 16px; }
  #commitStatus { font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="page">
  <nav class="topnav">
    <div class="brand">📦 NAN｜推し研究所 代購賣場工具</div>
    <div class="tabs">
      <a href="/pricing.html">定價計算機</a>
      <a href="/records.html">銷售紀錄</a>
      <a href="/stock.html">庫存管理</a>
      <a href="/import.html" class="active">匯入訂單</a>
    </div>
    <div class="right">
      <form method="POST" action="/logout" style="margin:0;">
        <button type="submit" class="btn small">登出</button>
      </form>
    </div>
  </nav>

  <h1>匯入訂單</h1>
  <p class="sub">上傳賣貨便匯出的 Excel，系統會自動比對哪些訂單已經key過（略過不動）、哪些是新的。商品比對得上編號+顏色+價格的會直接標記可匯入；比對不上的會用紅字標出來，你可以手動選正確的商品或自己輸入，確認沒問題後才會真正寫入訂單。</p>

  <div class="panel panel-pad" id="uploadPanel">
    <div class="field">
      <label for="fileInput">賣貨便匯出的 Excel 檔（.xlsx）</label>
      <input type="file" id="fileInput" accept=".xlsx">
    </div>
    <button class="btn primary" id="parseBtn">解析檔案</button>
    <span id="parseStatus" class="sub" style="margin:10px 0 0; display:none;"></span>
    <div class="field-error show" id="uploadError" style="display:none;"></div>
  </div>

  <div id="reviewSection" style="display:none; margin-top:20px;">
    <div class="panel panel-pad" style="margin-bottom:16px;">
      <h2>批次預設值</h2>
      <p class="sub" style="margin-bottom:14px;">套用到這次所有「新訂單」，匯入前都可以調整。</p>
      <div class="field-grid">
        <div class="field">
          <label for="defaultStatus">訂單狀態</label>
          <select id="defaultStatus">
            <option value="待處理" selected>待處理</option>
            <option value="已下貨">已下貨</option>
            <option value="已出貨">已出貨</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="field">
          <label for="shipDays">出貨天數（訂購日 + N 天 = 出貨期限）</label>
          <input type="number" id="shipDays" value="21" min="0">
        </div>
      </div>
    </div>

    <details class="panel panel-pad" style="margin-bottom:16px;">
      <summary style="cursor:pointer; font-family:var(--font-display); font-weight:600; font-size:18px;">已存在系統裡，略過 <span class="chip good" id="dupCount">0 筆</span></summary>
      <div id="dupList" class="empty-state" style="margin-top:14px;">—</div>
    </details>

    <h2>新訂單 <span class="chip warn" id="newCount">0 筆</span></h2>
    <label class="select-all-label" style="margin-bottom:10px; display:inline-flex;">
      <input type="checkbox" id="selectAllOrders"> 全選匯入
    </label>
    <div id="orderList"></div>

    <div class="panel commit-bar">
      <button class="btn primary" id="commitBtn">確認匯入已勾選的訂單</button>
      <span id="commitStatus"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var state = { duplicates: [], newOrders: [], catalog: [], stockById: {}, picker: { orderIdx: null, itemIdx: null } };

  var REASON_LABEL = {
    no_prefix: '商品庫裡找不到對應的商品（編號跟名稱都比對不到）',
    unknown_item_no: '商品庫裡找不到這個編號',
    price_mismatch: '商品對得上，但價格跟商品庫不一致',
    ambiguous_color: '比對到多個顏色候選，無法自動判斷',
    ambiguous_name: '比對到多個同樣長度的商品名稱候選，無法自動判斷是哪一個',
    no_color_match: '找到商品，但顏色對不起來'
  };

  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  function fmt(n) { return 'NT$' + (Number(n) || 0).toLocaleString(); }

  function addDays(dateStr, days) {
    var d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + (Number(days) || 0));
    return d.toISOString().slice(0, 10);
  }

  $('parseBtn').addEventListener('click', function () {
    var file = $('fileInput').files[0];
    $('uploadError').style.display = 'none';
    if (!file) {
      $('uploadError').textContent = '請先選擇檔案';
      $('uploadError').style.display = 'block';
      return;
    }
    var fd = new FormData();
    fd.append('file', file);
    $('parseBtn').disabled = true;
    $('parseStatus').style.display = 'inline';
    $('parseStatus').textContent = '解析中…';
    fetch('/api/import/feebee/parse', { method: 'POST', body: fd })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        $('parseBtn').disabled = false;
        $('parseStatus').style.display = 'none';
        if (!res.ok) {
          $('uploadError').textContent = res.data.error || '解析失敗';
          $('uploadError').style.display = 'block';
          return;
        }
        state.duplicates = res.data.duplicates || [];
        state.catalog = res.data.catalog || [];
        state.newOrders = (res.data.newOrders || []).map(function (o) {
          o.items.forEach(function (it) {
            it.resolved = it.status === 'matched';
            it.resolution = it.status === 'matched' ? Object.assign({ source: 'matched' }, it.matched) : null;
            it.editing = false;
            it.addedManually = false;
            it.isGift = false;
            it.giftOriginalPrice = null;
          });
          o.included = true;
          o.importState = null; // null | 'done' | 'error'
          o.mergeAcknowledged = !o.mergeSuspect;
          o.handleOverride = o.feedbackHandle || o.customerMasked || '';
          return o;
        });
        renderDuplicates();
        renderNewOrders();
        $('reviewSection').style.display = 'block';
        // 「新增商品」的圖片選圖要顯示庫存，另外撈一次 /api/stock（只有開啟
        // 追蹤的商品才有庫存數字，跟 records.html 的 stockById 同一套邏輯）。
        return fetch('/api/stock').then(function (r) { return r.json(); }).then(function (stockData) {
          state.stockById = {};
          (stockData.items || []).forEach(function (it) {
            if (it.track_stock) state.stockById[it.id] = { stock: it.stock, low: it.low_stock, stockGroupId: it.stock_group_id };
          });
        });
      })
      .catch(function (err) {
        $('parseBtn').disabled = false;
        $('parseStatus').style.display = 'none';
        $('uploadError').textContent = '解析失敗：' + err.message;
        $('uploadError').style.display = 'block';
      });
  });

  function renderDuplicates() {
    $('dupCount').textContent = state.duplicates.length + ' 筆';
    var el = $('dupList');
    if (state.duplicates.length === 0) {
      el.className = 'empty-state';
      el.textContent = '沒有重複的訂單';
      return;
    }
    el.className = '';
    el.innerHTML = state.duplicates.map(function (d) {
      return '<div class="dup-row"><span>' + d.orderNo + ' · ' + (d.customerMasked || '') + ' · ' + d.date + '</span><span>' + d.itemCount + ' 樣商品</span></div>';
    }).join('');
  }

  // 比對成功/選圖選定前，用賣貨便原始文字跟單價當佔位；比對出來之後一律用
  // it.resolution 的值，這樣贈品歸零售價、搜整個商品庫換規格這些才會立刻反映
  // 在卡片跟訂單總額/淨利上，不會卡在舊的 unitPrice。
  function itemEffectivePrice(it) { return it.resolution ? (Number(it.resolution.price) || 0) : (Number(it.unitPrice) || 0); }
  function itemEffectiveCost(it) { return it.resolution ? (Number(it.resolution.cost) || 0) : 0; }

  function itemCardHtml(it, lockedToCompact) {
    var name = it.resolution ? it.resolution.name : it.rawName;
    var color = it.resolution ? it.resolution.color : '';
    var photo = it.resolution ? it.resolution.photoUrl : null;
    var cost = itemEffectiveCost(it);
    var price = itemEffectivePrice(it);
    var html = '<div class="oi-card">';
    html += photo ? '<img src="' + escapeHtml(photo) + '" alt="">' : '<div class="oi-placeholder">🖼️</div>';
    html += '<div class="oi-info">';
    html += '<span class="oi-name">' + escapeHtml(name || '（尚未選擇商品）') + (color ? ' <span class="oi-size">（' + escapeHtml(color) + '）</span>' : '') + (it.isGift ? ' <span class="oi-gift-tag">贈品</span>' : '') + '</span>';
    html += '<span class="oi-nums">' + fmt(cost) + ' → ' + fmt(price) + '</span>';
    html += '</div>';
    html += '<input type="number" class="oi-qty-input" value="' + it.qty + '" min="1" title="數量（改小會自動拆成兩筆，方便分開選不同規格/贈品）">';
    if (it.resolution) html += '<button type="button" class="oi-gift-btn' + (it.isGift ? ' active' : '') + '">' + (it.isGift ? '🎁 贈品中' : '🎁 設為贈品') + '</button>';
    if (lockedToCompact) html += '<button type="button" class="oi-edit-btn">編輯</button>';
    // 不是只有「新增商品」加的才能移除——改數量拆出來的那幾行、或賣貨便本來
    // 解析出來但其實不該匯入的商品，都要能移除，不限定是手動加的才有這顆鈕。
    html += '<button type="button" class="oi-remove-btn">移除</button>';
    html += '</div>';
    return html;
  }

  function itemRowHtml(orderIdx, itemIdx, it) {
    var flagged = it.status !== 'matched';
    // 只有兩種情況會收合掉下面的選單/搜尋控制區：① 系統自己比對出來、有信心的
    // (status === 'matched')，這個從一開始就是這樣顯示，沒人反應過問題；
    // ② 用「新增商品」的圖片選圖面板加的，因為它沒有別的內嵌編輯介面，收合
    // 純粹是因為沒有東西可以一直開著。原本賣貨便解析出來的紅字商品(不管是
    // 窄選單選的還是用「搜整個商品庫」選的)刻意不收合控制區——但不管收不收合，
    // 上面的商品卡片(縮圖/名稱/規格/數量/售價)一律完整顯示，不會只剩一行字。
    var lockedToCompact = it.addedManually ? it.resolved : (it.status === 'matched');
    var showControl = it.editing || !lockedToCompact;
    var rowClass = 'oi-row ' + (flagged ? 'flag' : 'ok') + (it.resolved ? ' resolved' : '');
    var html = '<div class="' + rowClass + '" data-order="' + orderIdx + '" data-item="' + itemIdx + '">';

    html += itemCardHtml(it, lockedToCompact);

    if (showControl) {
      if (flagged) html += '<div class="oi-raw">' + (it.resolved ? '✓「' + it.rawName + '」：已確認' : '⚠「' + it.rawName + '」：' + (REASON_LABEL[it.reason] || '需要確認')) + '</div>';
      var currentId = (it.resolution && (it.resolution.priced_item_id || it.resolution.id)) || it.suggestedId;
      if (it.candidates.length > 0) {
        html += '<select class="oi-candidate-select">';
        html += '<option value="">— 選擇正確商品 —</option>';
        it.candidates.forEach(function (c) {
          var sel = currentId === c.id ? ' selected' : '';
          html += '<option value="' + c.id + '" data-cost="' + c.cost + '" data-price="' + c.price + '" data-name="' + c.name + '" data-color="' + (c.color || '') + '" data-photo="' + (c.photoUrl || '') + '"' + sel + '>' + (c.color || '(無色)') + ' · ' + fmt(c.price) + '</option>';
        });
        html += '<option value="__manual__"' + (it.resolution && it.resolution.source === 'manual' ? ' selected' : '') + '>自己輸入（不連結商品庫）</option>';
        html += '</select>';
      }
      // 這個清單只會列出跟商品編號同一組的候選，真的找不到對的時候改開圖片
      // 選圖面板搜整個商品庫——跟「新增商品」那顆編輯按鈕是同一套流程。
      html += '<button type="button" class="oi-pick-btn">🔍 搜整個商品庫</button>';
      var showManual = it.candidates.length === 0 || (it.resolution && it.resolution.source === 'manual');
      html += '<div class="oi-manual-fields" style="' + (showManual ? '' : 'display:none;') + '">';
      html += '<input type="text" class="oi-manual-name" placeholder="商品名稱" value="' + (it.resolution && it.resolution.name || it.rawName).replace(/"/g, '&quot;') + '">';
      html += '<input type="number" class="oi-manual-cost" placeholder="成本" value="' + (it.resolution ? it.resolution.cost : '') + '">';
      html += '<input type="number" class="oi-manual-price" placeholder="售價" value="' + (it.resolution ? it.resolution.price : it.unitPrice) + '">';
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function mergeWarningHtml(orderIdx, o) {
    var ms = o.mergeSuspect;
    var cls = 'merge-warning' + (o.mergeAcknowledged ? ' acked' : '');
    var partners = ms.combinedWithOrderNos.join('、');
    var html = '<div class="' + cls + '" data-order="' + orderIdx + '">';
    html += '⚠ 這筆的客人跟訂單編號「' + partners + '」加起來的金額（' + fmt(ms.combinedTotal) + '）剛好等於系統裡已經有的訂單 ' + ms.intoOrderNo + '，';
    html += '很可能是賣貨便「訂單合併」產生的 A/B，' + ms.intoOrderNo + ' 是合併後的訂單——這只是金額推論，不是賣貨便資料裡明講的欄位，請自己確認。';
    html += '<label><input type="checkbox" class="merge-ack-checkbox" ' + (o.mergeAcknowledged ? 'checked' : '') + '> 我確認過了，這筆真的要匯入（不是重複）</label>';
    html += '</div>';
    return html;
  }

  // 新增/刪除/改數量/設贈品後訂單總額跟淨利都要跟著動，不能一直沿用解析當下
  // 算好的 orderTotal，也不能只看 it.unitPrice（贈品歸零、換規格改價都是改
  // it.resolution，不是 unitPrice）。
  function currentOrderTotal(o) {
    return o.items.reduce(function (s, it) { return s + itemEffectivePrice(it) * it.qty; }, 0) - (Number(o.discountAmount) || 0);
  }
  function currentOrderProfit(o) {
    return o.items.reduce(function (s, it) { return s + (itemEffectivePrice(it) - itemEffectiveCost(it)) * it.qty; }, 0) - (Number(o.discountAmount) || 0);
  }

  function orderCardHtml(o, idx) {
    var statusCls = o.importState === 'done' ? 'imported' : (o.importState === 'error' ? 'import-error' : '');
    var mainHtml = '<div class="oc-head">';
    mainHtml += '<div class="oc-head-left">';
    mainHtml += '<input type="checkbox" class="oc-include" data-order="' + idx + '" ' + (o.included ? 'checked' : '') + (o.importState === 'done' ? ' disabled' : '') + '>';
    mainHtml += '<input type="text" class="oc-name-input" data-order="' + idx + '" value="' + escapeHtml(o.handleOverride || '') + '" placeholder="顧客名稱/帳號"' + (o.importState === 'done' ? ' disabled' : '') + '>';
    mainHtml += '<span class="chip info">' + o.orderNo + '</span>';
    if (o.repeatCount > 0) mainHtml += '<span class="oc-repeat">🔁 回購第' + o.repeatCount + '次</span>';
    mainHtml += '</div>';
    mainHtml += '<span class="oc-meta">' + o.date + ' · 共 ' + fmt(currentOrderTotal(o)) + ' · 淨利 ' + fmt(currentOrderProfit(o)) + (o.importState === 'done' ? ' · 已匯入' : (o.importState === 'error' ? ' · 匯入失敗：' + (o.importError || '') : '')) + '</span>';
    mainHtml += '</div>';
    if (o.mergeSuspect) mainHtml += mergeWarningHtml(idx, o);
    o.items.forEach(function (it, i) { mainHtml += itemRowHtml(idx, i, it); });
    if (o.importState !== 'done') mainHtml += '<button type="button" class="oc-add-item" data-order="' + idx + '">+ 新增商品（例如飛機盒等包材）</button>';
    mainHtml += '<textarea class="oc-note" data-order="' + idx + '" placeholder="訂單備註…">' + escapeHtml(o.note || '') + '</textarea>';

    var html = '<div class="panel panel-pad order-card ' + statusCls + '" data-order="' + idx + '">';
    // 選圖面板開著的時候分兩欄顯示（見 .oc-split 的 CSS 註解），兩邊同時看得到，
    // 不用一直滑上滑下比對訂單內容跟選圖結果；沒開的時候維持原本單欄排版。
    if (state.picker.orderIdx === idx) {
      html += '<div class="oc-split">';
      html += '<div class="oc-picker-col">' + pickerPanelHtml() + '</div>';
      html += '<div class="oc-main-col">' + mainHtml + '</div>';
      html += '</div>';
    } else {
      html += mainHtml;
    }
    html += '</div>';
    return html;
  }

  function renderNewOrders() {
    $('newCount').textContent = state.newOrders.length + ' 筆';
    $('orderList').innerHTML = state.newOrders.map(orderCardHtml).join('');
    syncSelectAllCheckbox();
    // 選圖面板開著的時候，任何會觸發整個訂單列表重畫的操作（設贈品、改數量、
    // 選下拉選單…）都會讓 orderCardHtml 重新插進一個全新、空的 #pickerGallery
    // 容器——裡面的商品格子是另外呼叫 renderPickerGallery() 才畫出來的，不會
    // 自動跟著回來，畫面上看起來就像左邊的商品欄整個跳掉。統一在這裡補畫，
    // 不管是哪個操作觸發的重畫都不會漏。
    if (state.picker.orderIdx !== null) renderPickerGallery();
  }

  // 已經匯入成功的訂單不能再勾（checkbox 會被 disable），全選只管還能動的那些。
  function syncSelectAllCheckbox() {
    var selectable = state.newOrders.filter(function (o) { return o.importState !== 'done'; });
    var box = $('selectAllOrders');
    if (selectable.length === 0) {
      box.checked = false;
      box.indeterminate = false;
      return;
    }
    var includedCount = selectable.filter(function (o) { return o.included; }).length;
    box.checked = includedCount === selectable.length;
    box.indeterminate = includedCount > 0 && includedCount < selectable.length;
  }

  $('selectAllOrders').addEventListener('change', function (e) {
    var checked = e.target.checked;
    state.newOrders.forEach(function (o) {
      if (o.importState !== 'done') o.included = checked;
    });
    renderNewOrders();
  });

  function handleCandidateSelect(e, it) {
    var opt = e.target.selectedOptions[0];
    if (!opt || !opt.value) {
      it.resolved = false;
      it.resolution = null;
    } else if (opt.value === '__manual__') {
      it.resolved = false;
      it.resolution = { source: 'manual', name: it.rawName, cost: '', price: it.unitPrice };
    } else {
      it.resolved = true;
      it.resolution = { source: 'matched', priced_item_id: opt.value, id: opt.value, name: opt.getAttribute('data-name'), color: opt.getAttribute('data-color'), cost: Number(opt.getAttribute('data-cost')), price: Number(opt.getAttribute('data-price')), photoUrl: opt.getAttribute('data-photo') || null };
      it.editing = false; // 選定商品後收合回鎖定顯示，避免後面不小心又點到選單
    }
    renderNewOrders();
  }

  // 手動輸入欄位故意同時聽 input + change：change 要等失焦才會觸發，使用者填完
  // 直接點「確認匯入」有時候來不及先失焦，resolved 狀態會跟畫面對不起來。
  function handleManualField(row, it) {
    if (!it.resolution || it.resolution.source !== 'manual') it.resolution = { source: 'manual' };
    it.resolution.source = 'manual';
    it.resolution.name = row.querySelector('.oi-manual-name').value.trim();
    it.resolution.cost = Number(row.querySelector('.oi-manual-cost').value) || 0;
    it.resolution.price = Number(row.querySelector('.oi-manual-price').value) || 0;
    it.resolved = !!it.resolution.name;
    row.classList.toggle('resolved', it.resolved);
  }

  function onOrderListEvent(e) {
    var row = e.target.closest('.oi-row');
    if (row) {
      var oIdx = Number(row.getAttribute('data-order'));
      var iIdx = Number(row.getAttribute('data-item'));
      var it = state.newOrders[oIdx].items[iIdx];

      if (e.target.classList.contains('oi-candidate-select')) {
        if (e.type === 'change') handleCandidateSelect(e, it);
        return;
      }

      if (e.target.classList.contains('oi-manual-name') || e.target.classList.contains('oi-manual-cost') || e.target.classList.contains('oi-manual-price')) {
        handleManualField(row, it);
        return;
      }

      if (e.target.classList.contains('oi-edit-btn') && e.type === 'click') {
        // 手動加的商品一律重新打開圖片選圖面板去換，不是用舊的下拉選單。
        if (it.addedManually) { openPicker(oIdx, iIdx); }
        else { it.editing = true; renderNewOrders(); }
        return;
      }

      if (e.target.classList.contains('oi-pick-btn') && e.type === 'click') {
        openPicker(oIdx, iIdx);
        return;
      }

      // 數量改小會自動把差額拆成新的一行——同一筆娃包買2件，但客人備註說要
      // 兩個不同顏色時，拆開後兩行才能各自獨立選規格/設贈品。改大就單純加數量，
      // 沒有「從哪裡補」的對應關係，不用特別處理。
      if (e.target.classList.contains('oi-qty-input') && e.type === 'change') {
        var newQty = Math.max(1, Math.round(Number(e.target.value)) || 1);
        var orderForQty = state.newOrders[oIdx];
        if (newQty < it.qty) {
          var remainder = it.qty - newQty;
          it.qty = newQty;
          var clone = JSON.parse(JSON.stringify(it));
          clone.qty = remainder;
          orderForQty.items.splice(iIdx + 1, 0, clone);
        } else {
          it.qty = newQty;
        }
        renderNewOrders();
        return;
      }

      if (e.target.classList.contains('oi-gift-btn') && e.type === 'click') {
        if (!it.resolution) return;
        if (it.isGift) {
          it.resolution.price = it.giftOriginalPrice != null ? it.giftOriginalPrice : it.resolution.price;
          it.giftOriginalPrice = null;
          it.isGift = false;
        } else {
          it.giftOriginalPrice = it.resolution.price;
          it.resolution.price = 0;
          it.isGift = true;
        }
        renderNewOrders();
        return;
      }

      if (e.target.classList.contains('oi-remove-btn') && e.type === 'click') {
        var order = state.newOrders[oIdx];
        if (order.items.length <= 1) { showToast('這張訂單至少要留一樣商品，不能全部移除'); return; }
        order.items.splice(iIdx, 1);
        renderNewOrders();
        return;
      }
    }

    var addBtn = e.target.closest('.oc-add-item');
    if (addBtn && e.type === 'click') {
      openPicker(Number(addBtn.getAttribute('data-order')), null);
      return;
    }

    if (e.target.classList.contains('oc-include') && e.type === 'change') {
      var cardIdx = Number(e.target.getAttribute('data-order'));
      state.newOrders[cardIdx].included = e.target.checked;
      syncSelectAllCheckbox();
      return;
    }

    // 顧客名稱/訂單備註故意不整個 re-render：打字打到一半重畫會把這兩個欄位
    // 整個換掉，游標跟焦點都會不見，直接改 state 就好，commit 的時候會讀到。
    if (e.target.classList.contains('oc-name-input') && (e.type === 'input' || e.type === 'change')) {
      state.newOrders[Number(e.target.getAttribute('data-order'))].handleOverride = e.target.value;
      return;
    }
    if (e.target.classList.contains('oc-note') && (e.type === 'input' || e.type === 'change')) {
      state.newOrders[Number(e.target.getAttribute('data-order'))].note = e.target.value;
      return;
    }

    var warning = e.target.closest('.merge-warning');
    if (warning && e.target.classList.contains('merge-ack-checkbox') && e.type === 'change') {
      var wIdx = Number(warning.getAttribute('data-order'));
      state.newOrders[wIdx].mergeAcknowledged = e.target.checked;
      warning.classList.toggle('acked', e.target.checked);
      return;
    }

    // 選圖面板現在是動態插進訂單卡片裡的，不是頁面載入時就固定存在的元素，
    // 不能在頁面一開始就綁事件，改成跟其他訂單列表裡的東西一樣用委派處理。
    if (e.target.id === 'pickerCancel' && e.type === 'click') { closePicker(); return; }
    if (e.target.id === 'pickerSearch' && e.type === 'input') { renderPickerGallery(); return; }
    if (e.target.id === 'pickerSizeCancel' && e.type === 'click') { closePickerSizeView(); return; }
    if (e.target.id === 'pickerManualAdd' && e.type === 'click') { submitPickerManualAdd(); return; }
  }

  $('orderList').addEventListener('change', onOrderListEvent);
  $('orderList').addEventListener('input', onOrderListEvent);
  $('orderList').addEventListener('click', onOrderListEvent);

  /* ======================================================================
     新增商品：圖片選圖面板
     跟 records.html 的商品圖庫/選尺寸挑選邏輯同一套（COLOR_ORDER/groupOptions/
     sortByItemNo 等等都是直接搬過來），差別只在於：選定後是「解析這張訂單的
     items」而不是「加進購物車」，而且拿掉了「新增尺寸／編輯價格」那些跟匯入
     無關、屬於商品庫管理的功能。
     ====================================================================== */

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var COLOR_ORDER = ['紅', '粉', '橘', '橙', '黃', '綠', '青', '藍', '紫', '黑', '白', '棕', '灰', '金', '銀', '彩色'];
  function colorRank(v) {
    if (!v) return Infinity;
    var exact = COLOR_ORDER.indexOf(v);
    if (exact !== -1) return exact * 2;
    for (var i = 0; i < COLOR_ORDER.length; i++) {
      if (v.indexOf(COLOR_ORDER[i]) !== -1) return i * 2 + 1;
    }
    return Infinity;
  }

  function pickerOptionLabel(size, color, spec1Name) {
    var parts = [];
    if (size) parts.push(size);
    if (color) parts.push(spec1Name ? (spec1Name + ':' + color) : ('🎨' + color));
    return parts.length ? parts.join(' ') : '(無標示規格)';
  }

  function parseSizes(sizesStr) {
    return (sizesStr || '').split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function groupProducts(products) {
    var byName = {}; var order = [];
    products.forEach(function (p) {
      var key = p.name || '未命名商品';
      if (!byName[key]) { byName[key] = []; order.push(key); }
      byName[key].push(p);
    });
    return order.map(function (name) { return { name: name, variants: byName[name] }; });
  }

  function groupOptions(group) {
    var options = [];
    group.variants.forEach(function (p) {
      var sizes = parseSizes(p.sizes);
      if (sizes.length === 0) options.push({ product: p, size: '', color: p.color || '' });
      else sizes.forEach(function (s) { options.push({ product: p, size: s, color: p.color || '' }); });
    });
    function sizeGroupKey(opt) {
      if (opt.size) return opt.size;
      var m = /[（(]([^）)]+)[）)]\s*$/.exec(opt.color || '');
      return m ? m[1] : '';
    }
    var sizeOrder = [];
    options.forEach(function (opt) {
      var key = sizeGroupKey(opt);
      if (sizeOrder.indexOf(key) === -1) sizeOrder.push(key);
    });
    options = options
      .map(function (opt, idx) { return { opt: opt, idx: idx }; })
      .sort(function (a, b) {
        var sa = sizeOrder.indexOf(sizeGroupKey(a.opt)), sb = sizeOrder.indexOf(sizeGroupKey(b.opt));
        if (sa !== sb) return sa - sb;
        var ca = colorRank(a.opt.color), cb = colorRank(b.opt.color);
        if (ca !== cb) return ca - cb;
        return a.idx - b.idx;
      })
      .map(function (x) { return x.opt; });
    return options;
  }

  function uniqNonEmpty(arr) {
    var seen = {}; var out = [];
    arr.forEach(function (v) { if (!v || seen[v]) return; seen[v] = true; out.push(v); });
    return out;
  }

  function nameOrderPrefix(name) {
    var m = /^[（(]\s*(\d+)\s*[）)]/.exec(name || '');
    return m ? Number(m[1]) : Infinity;
  }

  function sortByItemNo(products) {
    return products.slice().sort(function (a, b) {
      var an = a.item_no != null ? a.item_no : Infinity;
      var bn = b.item_no != null ? b.item_no : Infinity;
      if (an !== bn) return an - bn;
      var pa = nameOrderPrefix(a.name), pb = nameOrderPrefix(b.name);
      if (pa !== pb) return pa - pb;
      return new Date(a.created_at) - new Date(b.created_at);
    });
  }

  function groupBySortGroup(products) {
    var groups = {}; var order = [];
    products.forEach(function (p) {
      var g = (p.sort_group || '').trim() || '未分類';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p);
    });
    order.sort(function (a, b) {
      if (a === '未分類') return 1;
      if (b === '未分類') return -1;
      return a.localeCompare(b, 'zh-Hant');
    });
    return order.map(function (g) { return { group: g, products: sortByItemNo(groups[g]) }; });
  }

  function stockOf(productId) {
    var s = state.stockById[productId];
    return s ? s.stock : null;
  }
  function stockState(n, low) {
    if (n <= 0) return 'out';
    if (low) return 'low';
    return 'ok';
  }
  function groupStock(variants) {
    var tracked = variants.filter(function (v) { return state.stockById[v.id]; });
    if (tracked.length === 0) return null;
    var seenGroupIds = {}; var total = 0;
    tracked.forEach(function (v) {
      var gid = state.stockById[v.id].stockGroupId;
      if (gid) { if (seenGroupIds[gid]) return; seenGroupIds[gid] = true; }
      total += state.stockById[v.id].stock;
    });
    return { total: total, anyLow: tracked.some(function (v) { return state.stockById[v.id].low; }) };
  }

  function buildGalleryCard(group) {
    var options = groupOptions(group);
    var thumbUrl = (group.variants.filter(function (v) { return v.photo_url; })[0] || {}).photo_url;
    var prices = options.map(function (o) { return Number(o.product.final_price) || 0; });
    var priceLabel = Math.min.apply(null, prices) !== Math.max.apply(null, prices)
      ? 'NT$' + Math.min.apply(null, prices).toLocaleString() + '~' + Math.max.apply(null, prices).toLocaleString()
      : fmt(prices[0]);
    var itemNo = group.variants[0] && group.variants[0].item_no != null ? group.variants[0].item_no : null;

    var card = document.createElement('div');
    card.className = 'gallery-card';
    var gs = groupStock(group.variants);
    var stockBadge = gs
      ? '<div class="gc-stock ' + stockState(gs.total, gs.anyLow) + '">' + (gs.total <= 0 ? '售完' : '剩' + gs.total) + '</div>'
      : '';
    card.innerHTML =
      (itemNo != null ? '<div class="gc-itemno">' + itemNo + '</div>' : '') +
      stockBadge +
      (thumbUrl ? '<img src="' + escapeHtml(thumbUrl) + '" alt="">' : '<div class="gc-placeholder">🖼️</div>') +
      '<div class="gc-name">' + escapeHtml(group.name) + '</div>' +
      '<div class="gc-price">' + priceLabel + '</div>';
    card.addEventListener('click', function () {
      if (options.length === 1 && !options[0].size) confirmPickerSelection(options[0].product, '');
      else openPickerSizeView(group.name, options);
    });
    return card;
  }

  function pickerPanelHtml() {
    var html = '<div class="picker-panel" id="pickerPanel">';
    html += '<div class="picker-head"><h2 style="margin:0;">選商品</h2><button type="button" class="btn small" id="pickerCancel">✕ 完成</button></div>';
    html += '<input type="text" id="pickerSearch" placeholder="搜尋商品名稱…">';
    html += '<div class="product-gallery" id="pickerGallery" style="margin-top:10px;"></div>';
    html += '<div class="size-picker" id="pickerSizePicker" style="display:none;">';
    html += '<div class="sp-title">「<span id="pickerSizeItemName"></span>」選規格</div>';
    html += '<div class="sp-quick" id="pickerSizeVariants"></div>';
    html += '<button type="button" class="sp-cancel" id="pickerSizeCancel">‹ 回商品清單</button>';
    html += '</div>';
    html += '<div class="picker-manual-add">';
    html += '<div class="pm-title">找不到嗎？自己輸入一次性品項（不連結商品庫）</div>';
    html += '<div class="pm-row">';
    html += '<input type="text" id="pickerManualName" placeholder="商品名稱">';
    html += '<input type="number" id="pickerManualCost" placeholder="成本">';
    html += '<input type="number" id="pickerManualPrice" placeholder="售價">';
    html += '<button type="button" class="btn small" id="pickerManualAdd">加入</button>';
    html += '</div></div></div>';
    return html;
  }

  function renderPickerGallery() {
    var el = $('pickerGallery');
    var term = ($('pickerSearch').value || '').trim().toLowerCase();
    var filtered = term ? state.catalog.filter(function (p) { return (p.name || '').toLowerCase().indexOf(term) !== -1; }) : state.catalog;

    if (state.catalog.length === 0) {
      el.innerHTML = '<p class="empty-state">商品庫是空的，可以用下面「自己輸入」。</p>';
      return;
    }
    if (filtered.length === 0) {
      el.innerHTML = '<p class="empty-state">找不到符合的商品，可以用下面「自己輸入」。</p>';
      return;
    }

    el.innerHTML = '';
    var sortGroups = groupBySortGroup(filtered);
    var onlyUngrouped = sortGroups.length === 1 && sortGroups[0].group === '未分類';

    if (onlyUngrouped) {
      var grid = document.createElement('div');
      grid.className = 'gallery-group-grid';
      groupProducts(sortGroups[0].products).forEach(function (group) { grid.appendChild(buildGalleryCard(group)); });
      el.appendChild(grid);
      return;
    }
    sortGroups.forEach(function (sg) {
      var details = document.createElement('details');
      details.className = 'gallery-group';
      details.open = true;
      var summary = document.createElement('summary');
      summary.textContent = sg.group + '（' + groupProducts(sg.products).length + '）';
      details.appendChild(summary);
      var grid = document.createElement('div');
      grid.className = 'gallery-group-grid';
      groupProducts(sg.products).forEach(function (group) { grid.appendChild(buildGalleryCard(group)); });
      details.appendChild(grid);
      el.appendChild(details);
    });
  }
  function closePickerSizeView() {
    $('pickerSizePicker').style.display = 'none';
    $('pickerSizeVariants').innerHTML = '';
  }

  function openPickerSizeView(name, options) {
    $('pickerSizeItemName').textContent = name;
    var colorCount = uniqNonEmpty(options.map(function (o) { return o.color; })).length;
    var sizeCount = uniqNonEmpty(options.map(function (o) { return o.size; })).length;
    var is2d = colorCount > 1 && sizeCount > 1;
    if (is2d) renderPicker2d(options); else renderPickerFlat(options);
    $('pickerSizePicker').style.display = '';
    $('pickerSizePicker').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function renderPickerFlat(options) {
    var el = $('pickerSizeVariants');
    el.innerHTML = '';
    options.forEach(function (opt) {
      var row = document.createElement('div');
      row.className = 'sp-option-row';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sp-option-select';
      btn.textContent = pickerOptionLabel(opt.size, opt.product.color, opt.product.spec1_name) + ' · ' + fmt(opt.product.final_price);
      var optStock = stockOf(opt.product.id);
      if (optStock !== null) {
        var tag = document.createElement('span');
        tag.className = 'sp-stock ' + stockState(optStock, state.stockById[opt.product.id].low);
        tag.textContent = optStock <= 0 ? '· 已售完' : '· 剩 ' + optStock;
        btn.appendChild(tag);
      }
      btn.addEventListener('click', function () { confirmPickerSelection(opt.product, opt.size); });
      row.appendChild(btn);
      el.appendChild(row);
    });
  }

  var picker2dSelectedColor = null;
  function renderPicker2d(options) {
    var el = $('pickerSizeVariants');
    el.innerHTML = '';
    picker2dSelectedColor = null;
    var colors = uniqNonEmpty(options.map(function (o) { return o.color; }));
    var sizes = uniqNonEmpty(options.map(function (o) { return o.size; }));
    var colorRow = document.createElement('div');
    colorRow.className = 'sp-color-row';
    var sizeGrid = document.createElement('div');
    sizeGrid.className = 'sp-size-grid';

    function findOption(size, color) { return options.find(function (o) { return o.size === size && o.color === color; }); }
    function refreshSizeButtons() {
      Array.from(sizeGrid.children).forEach(function (btn) {
        var size = btn.dataset.size;
        if (!picker2dSelectedColor) { btn.disabled = true; btn.querySelector('.sp-size-price').textContent = '請先選顏色'; return; }
        var match = findOption(size, picker2dSelectedColor);
        if (match) {
          btn.disabled = false;
          var ms = stockOf(match.product.id);
          btn.querySelector('.sp-size-price').textContent = fmt(match.product.final_price) + (ms === null ? '' : (ms <= 0 ? '・已售完' : '・剩' + ms));
        } else {
          btn.disabled = true;
          btn.querySelector('.sp-size-price').textContent = '無此組合';
        }
      });
    }
    colors.forEach(function (c) {
      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'sp-color-chip'; chip.textContent = c;
      chip.addEventListener('click', function () {
        picker2dSelectedColor = (picker2dSelectedColor === c) ? null : c;
        Array.from(colorRow.children).forEach(function (b) { b.classList.toggle('active', b === chip && picker2dSelectedColor === c); });
        refreshSizeButtons();
      });
      colorRow.appendChild(chip);
    });
    sizes.forEach(function (s) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'sp-size-cell'; btn.dataset.size = s;
      btn.innerHTML = '<span class="sp-size-label">' + escapeHtml(s) + '</span><span class="sp-size-price">請先選顏色</span>';
      btn.disabled = true;
      btn.addEventListener('click', function () {
        if (!picker2dSelectedColor) { showToast('請先選顏色'); return; }
        var match = findOption(s, picker2dSelectedColor);
        if (!match) return;
        confirmPickerSelection(match.product, match.size);
      });
      sizeGrid.appendChild(btn);
    });
    el.appendChild(colorRow);
    el.appendChild(sizeGrid);
  }

  // 選圖面板開在觸發它的那張訂單卡片裡面（見 orderCardHtml），所以開/關都要
  // 整個 re-render 訂單列表才會讓面板出現/消失，不是單純切換 display。
  function openPicker(orderIdx, itemIdx) {
    state.picker.orderIdx = orderIdx;
    state.picker.itemIdx = itemIdx;
    renderNewOrders();
    $('pickerSearch').value = '';
    $('pickerManualName').value = '';
    $('pickerManualCost').value = '';
    $('pickerManualPrice').value = '';
    renderPickerGallery();
    $('pickerPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closePicker() {
    state.picker.orderIdx = null;
    state.picker.itemIdx = null;
    renderNewOrders();
  }

  // 選了圖庫裡的商品／手動輸入，結果都走這裡：itemIdx 是 null 代表新增一行，
  // 不是 null 代表「編輯」既有那一行（例如重新選規格），直接原地換掉 resolution。
  // 故意不自動關面板——一次訂單常常要補好幾樣東西（飛機盒+贈品+...），選完
  // 一個接著選下一個，選完才按右上角「完成」自己關掉。
  function applyPickerResult(resolution) {
    var orderIdx = state.picker.orderIdx, itemIdx = state.picker.itemIdx;
    var order = state.newOrders[orderIdx];
    if (itemIdx == null) {
      order.items.push({
        rawName: '', qty: 1, unitPrice: resolution.price,
        status: 'needs_review', reason: null, matched: null, suggestedId: null, candidates: [],
        resolved: true, resolution: resolution, editing: false, addedManually: true,
        isGift: false, giftOriginalPrice: null
      });
    } else {
      order.items[itemIdx].resolution = resolution;
      order.items[itemIdx].resolved = true;
    }
    var keepSearch = $('pickerSearch') ? $('pickerSearch').value : '';
    state.picker.itemIdx = null; // 下一次選預設變成「新增」，不會一直改同一行
    renderNewOrders();
    $('pickerSearch').value = keepSearch;
    renderPickerGallery();
    showToast('已加入，可以繼續選下一樣，選完按右上角「完成」關閉');
  }

  function confirmPickerSelection(product, size) {
    var color = [size, product.color].filter(Boolean).join('・');
    applyPickerResult({
      source: 'matched',
      priced_item_id: product.id, id: product.id,
      name: product.name, color: color,
      cost: Number(product.actual_cost) || 0,
      price: Number(product.final_price) || 0,
      photoUrl: product.photo_url || null
    });
  }

  function submitPickerManualAdd() {
    var name = $('pickerManualName').value.trim();
    if (!name) { showToast('請先輸入商品名稱'); return; }
    applyPickerResult({
      source: 'manual',
      name: name,
      cost: Number($('pickerManualCost').value) || 0,
      price: Number($('pickerManualPrice').value) || 0
    });
  }

  function buildItemsPayload(order) {
    var rows = [];
    order.items.forEach(function (it) {
      var src = it.resolution;
      var row = {
        itemName: src.name,
        size: src.color || null,
        cost: Number(src.cost) || 0,
        soldPrice: Number(src.price) || 0,
        productId: src.source === 'manual' ? null : (src.priced_item_id || src.id || null),
        photoUrl: src.source === 'manual' ? null : (src.photoUrl || null),
        isGift: !!it.isGift
      };
      for (var q = 0; q < it.qty; q++) rows.push(row);
    });
    return rows;
  }

  $('commitBtn').addEventListener('click', function () {
    var toSend = state.newOrders.filter(function (o) { return o.included && o.importState !== 'done'; });
    if (toSend.length === 0) {
      showToast('沒有勾選要匯入的訂單');
      return;
    }
    var unresolved = toSend.filter(function (o) { return o.items.some(function (it) { return !it.resolved; }); });
    if (unresolved.length > 0) {
      showToast('還有 ' + unresolved.length + ' 筆訂單的商品沒有確認完，請先處理紅字的部分');
      return;
    }
    var unackedMerge = toSend.filter(function (o) { return o.mergeSuspect && !o.mergeAcknowledged; });
    if (unackedMerge.length > 0) {
      showToast('還有 ' + unackedMerge.length + ' 筆訂單疑似被合併過，請先確認紅字的合併警告');
      return;
    }

    var shipDays = Number($('shipDays').value) || 0;
    var defaultStatus = $('defaultStatus').value;
    $('commitBtn').disabled = true;

    var done = 0, failed = 0;
    function next(i) {
      if (i >= toSend.length) {
        $('commitBtn').disabled = false;
        $('commitStatus').textContent = '完成：成功 ' + done + ' 筆 / 失敗 ' + failed + ' 筆';
        renderNewOrders();
        return;
      }
      var order = toSend[i];
      $('commitStatus').textContent = '匯入中… (' + (i + 1) + '/' + toSend.length + ')';

      var fd = new FormData();
      var customerName = (order.handleOverride || order.feedbackHandle || order.customerMasked || '') + '/' + order.orderNo;
      fd.append('customerName', customerName);
      fd.append('orderStatus', defaultStatus);
      fd.append('shipBy', addDays(order.date, shipDays));
      fd.append('shippingFee', order.shippingFee || 0);
      fd.append('note', order.note || '');
      fd.append('soldAt', order.date);
      fd.append('discountAmount', order.discountAmount || 0);
      fd.append('discountReason', order.discountReason || '');
      fd.append('items', JSON.stringify(buildItemsPayload(order)));

      fetch('/api/orders', { method: 'POST', body: fd })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (res) {
          if (res.ok) { order.importState = 'done'; done++; }
          else { order.importState = 'error'; order.importError = res.data.error || '未知錯誤'; failed++; }
          next(i + 1);
        })
        .catch(function (err) {
          order.importState = 'error';
          order.importError = err.message;
          failed++;
          next(i + 1);
        });
    }
    next(0);
  });
</script>
</body>
</html>
